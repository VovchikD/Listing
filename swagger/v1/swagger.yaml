---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/listings":
    get:
      summary: list listings
      tags:
      - Listings
      security:
      - BearerAuth: []
      responses:
        '200':
          description: successful
    post:
      summary: create listing
      tags:
      - Listings
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                model:
                  type: string
              required:
              - name
              - model
  "/api/v1/listings/{id}":
    parameters:
    - name: id
      in: path
      description: ID
      required: true
      schema:
        type: string
    get:
      summary: show listing
      tags:
      - Listings
      security:
      - BearerAuth: []
      responses:
        '200':
          description: successful
    delete:
      summary: delete listing
      tags:
      - Listings
      security:
      - BearerAuth: []
      responses:
        '200':
          description: successful
  "/":
    get:
      summary: list listings
      tags:
      - Listings
      security:
      - BearerAuth: []
      responses:
        '200':
          description: successful
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
